# XAI-SNA AML System — Docker Compose
# Run: docker-compose up --build

version: "3.9"

services:
  aml-dashboard:
    build: .
    container_name: antigravity_aml
    ports:
      - "8501:8501"
    volumes:
      # Mount data directory so models/SHAP persist outside container
      - ./data:/app/data
      - ./aml_config.yaml:/app/aml_config.yaml
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Jupyter for exploration
  # jupyter:
  #   image: jupyter/datascience-notebook:latest
  #   ports:
  #     - "8888:8888"
  #   volumes:
  #     - .:/home/jovyan/work

networks:
  default:
    name: aml_network

